<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>
  :root { --bg: #f6f8fb; --ink: #0e1b33; --muted: #5d6b82; --accent: #1f4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --ink: #e8edf7; --muted: #93a0b8; --accent: #7fa2ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div>
  <h1 id="h">Redirecting…</h1>
  <p id="p"></p>
  <a href="../">See all registration links</a>
</div>
<script>
(async function () {
  // Same file works for every slug: copy this folder, rename it to the slug.
  const h = document.getElementById('h'), p = document.getElementById('p');
  function serverNow(res) {
    const d = Date.parse(res.headers.get('Date'));
    if (isNaN(d)) return new Date();
    return new Date(d + (parseInt(res.headers.get('Age') || '0', 10) || 0) * 1000);
  }
  try {
    const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '').toLowerCase();
    const res = await fetch('../links.json?v=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    const link = (data.links || []).find(l => l.slug.toLowerCase() === slug);
    if (!link) { h.textContent = 'Link not found'; p.textContent = 'This registration link does not exist.'; return; }
    if (serverNow(res) > new Date(link.deadline)) {
      h.textContent = 'Registration closed';
      p.textContent = '“' + link.title + '” closed on ' +
        new Intl.DateTimeFormat('en-GB', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Paris' }).format(new Date(link.deadline)) + '.';
      return;
    }
    p.textContent = link.title;
    location.replace(link.url);
  } catch (e) {
    h.textContent = 'Something went wrong';
    p.textContent = 'Please try again or go back to the list.';
  }
})();
</script>
</body>
</html>
