<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nucleate UniCA – Registration</title>
<style>
  :root {
    --bg: #f6f8fb; --surface: #ffffff; --ink: #0e1b33; --muted: #5d6b82;
    --line: #d9e0ec; --accent: #1f4fd8; --closed: #98a3b6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --surface: #121b2e; --ink: #e8edf7; --muted: #93a0b8;
            --line: #243049; --accent: #7fa2ff; --closed: #5b6780; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px 80px; }
  h1 { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a.row, div.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px;
         padding: 20px 4px; color: inherit; text-decoration: none; }
  a.row:hover .name, a.row:focus-visible .name { color: var(--accent); }
  a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .name { font-weight: 650; font-size: 1.1rem; }
  .path { color: var(--muted); font-size: .9rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .desc { grid-column: 1; color: var(--muted); font-size: .95rem; }
  .when { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: .88rem; color: var(--muted); align-self: center; }
  .closed .name, .closed .desc, .closed .path { color: var(--closed); }
  .closed .name { text-decoration: line-through; text-decoration-thickness: 1px; }
  .empty { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Registration</h1>
  <p class="sub" id="subtitle"></p>
  <ul id="list" aria-live="polite"></ul>
</main>
<script>
(async function () {
  // Trusted "now": server time from the HTTP Date header (+ Age if served from cache),
  // so a wrong or tampered device clock cannot open or close a registration.
  function serverNow(res) {
    const d = Date.parse(res.headers.get('Date'));
    if (isNaN(d)) return new Date();            // fallback: device clock
    const age = parseInt(res.headers.get('Age') || '0', 10) || 0;
    return new Date(d + age * 1000);
  }
  const list = document.getElementById('list');
  try {
    const res = await fetch('links.json?v=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    const site = data.site || {};
    document.getElementById('title').textContent = site.title || 'Registration';
    document.getElementById('subtitle').textContent = site.subtitle || '';
    document.title = site.title || document.title;
    const base = site.base || '';
    const now = serverNow(res);
    const fmt = new Intl.DateTimeFormat('en-GB', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Paris' });

    const isOpen = (n, dl) => {
      const t = Date.parse(dl);
      if (isNaN(t)) { console.warn('Invalid deadline for', dl); return true; }
      return n.getTime() <= t;
    };
    const items = (data.links || []).map(l => ({ ...l, open: isOpen(now, l.deadline) }));
    // Open first (soonest deadline first), then closed
    items.sort((a, b) => (b.open - a.open) || (new Date(a.deadline) - new Date(b.deadline)));

    if (!items.length) { list.innerHTML = '<li class="empty">No registrations at the moment.</li>'; return; }

    for (const l of items) {
      const li = document.createElement('li');
      const row = document.createElement(l.open ? 'a' : 'div');
      row.className = 'row' + (l.open ? '' : ' closed');
      if (l.open) row.href = base + '/' + l.slug;
      const mk = (cls, text) => { const e = document.createElement('span'); e.className = cls; e.textContent = text; return e; };
      const left = document.createElement('div');
      left.append(mk('name', l.title), document.createElement('br'), mk('path', 'nucleate-unica-fr/' + l.slug));
      row.append(left);
      if (l.description) row.append(mk('desc', l.description));
      row.append(mk('when', l.open ? 'Open until ' + fmt.format(new Date(l.deadline)) : 'Closed'));
      li.append(row);
      list.append(li);
    }
  } catch (e) {
    list.innerHTML = '<li class="empty">Could not load the registration list.</li>';
  }
})();
</script>
</body>
</html>
