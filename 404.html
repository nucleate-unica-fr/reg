<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>
  :root { --bg: #f6f8fb; --ink: #0e1b33; --muted: #5d6b82; --accent: #1f4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --ink: #e8edf7; --muted: #93a0b8; --accent: #7fa2ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div>
  <h1 id="h">Redirecting…</h1>
  <p id="p"></p>
  <a id="home" href="/">See all registration links</a>
</div>
<script>
(async function () {
  // Trusted "now": server time from the HTTP Date header (+ Age if served from cache),
  // so a wrong or tampered device clock cannot open or close a registration.
  function serverNow(res) {
    const d = Date.parse(res.headers.get('Date'));
    if (isNaN(d)) return new Date();            // fallback: device clock
    const age = parseInt(res.headers.get('Age') || '0', 10) || 0;
    return new Date(d + age * 1000);
  }
  const h = document.getElementById('h'), p = document.getElementById('p'), home = document.getElementById('home');
  try {
    // 404.html is served from any depth, so locate links.json via the base path
    // (first path segment on a github.io project site; adjust "base" in links.json otherwise).
    const guessBase = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] : '';
    let res = await fetch(guessBase + '/links.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) res = await fetch('/links.json?v=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    const base = (data.site && data.site.base) || '';
    home.href = base + '/';

    let path = location.pathname;
    if (base && path.startsWith(base)) path = path.slice(base.length);
    const slug = path.replace(/^\/+|\/+$/g, '').toLowerCase();

    const link = (data.links || []).find(l => l.slug.toLowerCase() === slug);
    if (!link) { h.textContent = 'Link not found'; p.textContent = 'This registration link does not exist.'; return; }

    if (serverNow(res) > new Date(link.deadline)) {
      h.textContent = 'Registration closed';
      p.textContent = '“' + link.title + '” closed on ' +
        new Intl.DateTimeFormat('en-GB', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Paris' }).format(new Date(link.deadline)) + '.';
      return;
    }
    p.textContent = link.title;
    location.replace(link.url);
  } catch (e) {
    h.textContent = 'Something went wrong';
    p.textContent = 'Please try again or go back to the list.';
  }
})();
</script>
</body>
</html>
